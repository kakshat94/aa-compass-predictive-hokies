training:
  # Historical P(secondary | primary) is computed from inputs/Supply_sample.csv.
  # Each value scales that proportion: effective = historical * scale.
  # 1.0 keeps the historical rate. 0.0 removes that secondary for that primary,
  # so nobody with that primary is trained in it. Values must be in [0, 1].
  secondary_proportion_scales:
    ATC:
      ROC: 0.25
      CHF: 0.15
      OC: 0.15
      Latin: 0.25
      Europe: 0.25
      Pacific: 0.25
    ROC:
      ATC: 0.25
      CHF: 0.2
      OC: 0.15
      Latin: 0.25
      Europe: 0.25
      Pacific: 0.25
    CHF:
      ATC: 0.25
      ROC: 0.25
      OC: 0.25
      Latin: 0.25
      Europe: 0.25
      Pacific: 0.25
    OC:
      ATC: 0.1
      ROC: 0.1
      CHF: 0.1
      Latin: 0.1
      Europe: 0.1
      Pacific: 0.1
    Latin:
      ATC: 0.25
      ROC: 0.25
      CHF: 0.25
      OC: 0.25
      Europe: 0.25
      Pacific: 0.25
    Europe:
      ATC: 0.25
      ROC: 0.25
      CHF: 0.25
      OC: 0.25
      Latin: 0.25
      Pacific: 0.25
    Pacific:
      ATC: 0.25
      ROC: 0.25
      CHF: 0.25
      OC: 0.25
      Latin: 0.25
      Europe: 0.25

