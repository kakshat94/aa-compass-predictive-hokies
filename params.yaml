vacation_lns:
  # Date that gets no vacations; its supply rows pass through unchanged.
  exclude_date:
    enabled: false
    date: "2026-01-11"

  # Shortage. allow_added: true -> vacations may leave a desk/shift short when the
  # rules need them; each unit of added shortage costs weight / number of dates,
  # so vacations go to staff above demand first. false -> the original model:
  # vacations never add shortage, and rules are met by giving fewer vacations.
  shortage:
    allow_added: true
    weight: 1000000                # price per unit of added shortage (rule weights are kept 10x above it)

  # Rule 1: vacations per date within [min - tolerance_below, max + tolerance_above].
  # The maximum is hard. The minimum comes before shortage.
  # enabled: false -> no daily range at all.
  rule1_daily_total:
    enabled: true
    min: 25
    max: 29
    tolerance_below: 0
    tolerance_above: 0
    # min_weight: 10000           # optional; only matters with shortage.allow_added: false
    #                             # (2 = the original soft 25). With allow_added: true it is
    #                             # always raised to 10 x shortage.weight.

  # Rule 2: fairness, measured in vacation DAYS per dispatcher (TECH_ID).
  # slack_days: null -> no hard band, only the two weights below.
  # slack_days: k    -> every dispatcher gets L-k .. L+1+k days, L chosen by
  #                     the model (max - min <= 2k + 1). 0 = L or L+1 days.
  rule2_fairness:
    slack_days: 12
    worst_weight: 1.0             # weight on the largest |days - mean days|
    average_weight: 1000.0           # weight on the average |days - mean days|

  # Rule 3: daily total inversely proportional to the day's volume.
  # mode proportional: target = K / volume, kept inside the rule-1 range, with
  #   K set so the targets average the base value (or (min + max) / 2 with no base);
  #   cap = target rounded up + tolerance, floor = target rounded down - tolerance
  #   (both also kept inside the rule-1 range).
  # mode rank_cap: the original rule: dates sorted by volume into 5 groups,
  #   caps max, max-1, ..., max-4 from quietest to busiest, plus cap_slack.
  rule3_inverse_volume:
    enabled: false
    mode: proportional
    tolerance: 2                  # proportional only: vacations per day either side of the target
    cap_slack: 0                  # rank_cap only

  # Base: annual total target (value +- tolerance) x number of dates.
  # With shortage.allow_added: true it comes before shortage (weight raised to
  # 10 x shortage.weight). With allow_added: false it is soft: each vacation
  # outside the range costs weight / number of dates.
  base_per_day:
    enabled: true
    value: 27
    tolerance: 0.75
    weight: 10

  # Local search (LNS) after the starting solution.
  search:
    lns_iterations: 80
    lns_seconds: 6.0
    lns_buckets: 6
    lns_max_buckets: 12
    workers: 4
    seed: 42

flex_maxflow:
  # Date removed from every flex input (no flex days, no demand counted on it);
  # its after-vacation rows pass through unchanged into the final supply.
  exclude_date:
    enabled: false
    date: "2026-01-11"
  max_days_per_dispatcher: 4      # minus days already in the pre-assigned flex file
  solver: maxflow                 # maxflow (exact) or greedy

training:
  # Historical P(secondary | primary) is computed from inputs/Supply_sample.csv.
  # Each value scales that proportion: effective = historical * scale.
  # 1.0 keeps the historical rate. 0.0 removes that secondary for that primary,
  # so nobody with that primary is trained in it. Values must be in [0, 1].
  secondary_proportion_scales:
    ATC:
      ROC: 1
      CHF: 1
      OC: 1
      Latin: 1
      Europe: 1
      Pacific: 1
    ROC:
      ATC: 1
      CHF: 1
      OC: 1
      Latin: 1
      Europe: 1
      Pacific: 1
    CHF:
      ATC: 1
      ROC: 1
      OC: 1
      Latin: 1
      Europe: 1
      Pacific: 1
    OC:
      ATC: 1
      ROC: 1
      CHF: 1
      Latin: 1
      Europe: 1
      Pacific: 1
    Latin:
      ATC: 1
      ROC: 1
      CHF: 1
      OC: 1
      Europe: 1
      Pacific: 1
    Europe:
      ATC: 1
      ROC: 1
      CHF: 1
      OC: 1
      Latin: 1
      Pacific: 1
    Pacific:
      ATC: 1
      ROC: 1
      CHF: 1
      OC: 1
      Latin: 1
      Europe: 1

